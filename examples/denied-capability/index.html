<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>audiframe · instrument</title
  ><link rel="stylesheet" href="../style.css" />
  <main>
    <h1>Optional capabilities</h1>
    <div class="steps" aria-label="Pattern"></div>
    <label
      >Level
      <input
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.3"
        aria-label="Level"
    /></label>
    <nav>
      <button id="play" title="Play a tone and enable audio">Play</button>
    </nav>
    <output aria-live="polite"></output>
    <button id="import" title="Exercise a denied optional files request">
      Import file</button
    ><button id="resize" title="Request a bounded host size">Resize</button>
  </main>
  <script type="module" src="../minimal-app/app.js"></script>
  <script type="module" src="denied.js"></script>
</html>
