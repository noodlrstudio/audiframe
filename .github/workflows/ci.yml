name: Conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npm run check && npm test && npm run size
      - run: node scripts/schemas.mjs && node scripts/fixtures.mjs && git diff --exit-code -- spec/schemas spec/fixtures packages/protocol/src/generated.ts
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci && npm run build
      - run: npx --yes --package=@playwright/cli@0.1.22 playwright install --with-deps chromium firefox webkit
      - run: node scripts/serve.mjs > /tmp/audiframe-server.log 2>&1 &
      - run: node scripts/browser-check.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.browser }}
          path: output/playwright
